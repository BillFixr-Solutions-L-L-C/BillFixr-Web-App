name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR rather than letting an
# outdated push race an in-flight deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Placeholder values only — this build is a compile-correctness
      # check, not a real deploy artifact. The actual deploy build (below)
      # pulls the project's real env vars from Vercel itself.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          RESEND_API_KEY: placeholder-resend-key
          CRON_SECRET: placeholder-cron-secret

      # Runs after build, not before — `next build` generates route/layout
      # prop types under .next/types that tsc needs to resolve (e.g.
      # LayoutProps); running typecheck first fails on a fresh checkout
      # with no prior .next/ directory. Still worth its own step since it
      # also covers files outside Next's own build (e.g. *.test.ts).
      - run: npm run typecheck

  # The two Python services under services/ were not covered by CI at all
  # until 2026-11-05: `npm test` never reaches them, so 140 tests only ever
  # ran on someone's laptop. Both services are deployed to Render and the
  # web app now calls them in production, so a regression here is a
  # production regression.
  #
  # Deliberately NOT a dependency of the deploy jobs below. Those ship the
  # Next.js app to Vercel; the Python services deploy separately to Render.
  # Blocking a web hotfix on an unrelated engine test failure would be a
  # coupling that does not exist in the deploy path. Make these required
  # status checks in branch protection instead — that is what stops a red
  # suite being merged, without tying together two things that ship apart.
  python:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # Both services are reported even when the first one fails, so a
      # failure in one does not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - service: ai-service
            install: pip install -e ".[dev]"
            lint: ruff check .
            deps: services/ai-service/pyproject.toml
          - service: automation-engine
            install: pip install -r requirements-dev.txt
            lint: ""
            deps: services/automation-engine/requirements*.txt
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # 3.11 is this project's floor (ai-service requires-python >=3.11)
      # and matches the Dockerfiles the Render services are built from.
      # cache-dependency-path is explicit because this step runs from the
      # repo root (`defaults.run.working-directory` applies to `run`, not
      # to actions), so pip's default lookup would not find the service's
      # own dependency file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}

      - run: ${{ matrix.install }}

      # Only ai-service configures ruff (pyproject.toml [tool.ruff]).
      - if: matrix.lint != ''
        run: ${{ matrix.lint }}

      - run: pytest -q


  # The engine's suite again, against the backend production actually uses.
  #
  # database.py speaks one dialect and translates it for Postgres, so a
  # mistake in that translation is invisible to the SQLite run above -- and
  # the thing it would break is the engine reading its own negotiations,
  # which is the only record that a letter was ever sent to a hospital.
  # Running both is the cheapest way to stop a suite agreeing with the code
  # instead of checking it.
  #
  # A separate job rather than another matrix entry: `services` cannot be
  # declared per matrix leg, and standing up Postgres for the ai-service
  # run would be noise.
  engine-postgres:
    name: Python tests (automation-engine on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: enginetest
          POSTGRES_DB: engine_test
        ports:
          - 5432:5432
        # Without the health check the first connection can land before
        # Postgres is accepting them, which fails at import time in
        # conftest and reads as a dialect bug.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/automation-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/automation-engine/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # ENGINE_TEST_DATABASE_URL, not ENGINE_DATABASE_URL: conftest.py
      # drops the engine's tables before the run, and reads the separate
      # name so that a real connection string in the environment can never
      # become the target by accident. The database is named engine_test
      # because conftest refuses to run against one that is not.
      - run: pytest -q
        env:
          ENGINE_TEST_DATABASE_URL: postgresql://postgres:enginetest@localhost:5432/engine_test

  # Deploys intentionally do NOT use `vercel pull` + `vercel build` +
  # `vercel deploy --prebuilt` (the pattern Vercel's own docs lead with).
  # That pattern builds locally on the runner, and this project has env
  # vars marked "Sensitive" in Vercel (NEXT_PUBLIC_SUPABASE_URL and
  # others) — Vercel deliberately refuses to hand sensitive values to a
  # local/CLI build, so `vercel pull` writes the literal string
  # "[SENSITIVE]" in their place. That shipped a broken production build
  # once already (2026-08-29) — the site 500'd because
  # NEXT_PUBLIC_SUPABASE_URL wasn't a real URL. `vercel deploy` without
  # `--prebuilt` instead uploads the source and lets Vercel's own build
  # infrastructure run `next build`, which is a context sensitive vars do
  # resolve in. Slower (no local build cache reuse) but correct, and
  # secrets never touch the GitHub-hosted runner either way.
  deploy-preview:
    name: Deploy preview
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            });

  deploy-production:
    name: Deploy production
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vercel deploy --prod` marks the deployment as the production
      # target, but does not reliably move the custom-domain aliases onto
      # it — confirmed 2026-08-29: two prior "successful" CI deploys (and
      # a fresh manual one) all left www.billfixr.com/billfixr.com
      # pointing at an old deployment, because a one-off manual
      # `vercel rollback` during an earlier incident left production
      # pinned. Explicitly re-aliasing every deploy makes this correct
      # regardless of any pinned state, instead of trusting the implicit
      # behavior.
      - name: Point the production domains at this deployment
        run: |
          vercel alias set ${{ steps.deploy.outputs.url }} www.billfixr.com --token=${{ secrets.VERCEL_TOKEN }}
          vercel alias set ${{ steps.deploy.outputs.url }} billfixr.com --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Render receives no push events from this repo, so every deploy of these
  # two services has been fired by hand. This replaces that, and is better
  # than repairing it would be: a push-triggered Render deploy runs in
  # parallel with CI, so it ships the services before their tests above
  # have finished. Gating on the suites means a red test stops the deploy.
  #
  # Deploy hooks rather than the Render API key, because a hook URL deploys
  # exactly one service while the API key can act on every service in the
  # workspace.
  #
  # Fire-and-forget: confirming a deploy reached "live" needs the API key,
  # so a green job here means Render accepted the request, not that the new
  # code is serving. Render's own notifyOnFail email is the backstop.
  deploy-services:
    name: Deploy Render services
    needs: [python, engine-postgres]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both ends of the pushed range have to be present for the diff
          # below, and a shallow clone has only the tip.
          fetch-depth: 0

      # Each service builds a Docker image from its own directory, so a
      # web-only change has nothing here to redeploy.
      - name: Which services changed?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          # A manual run has no range, and a force push can orphan the old
          # tip. Either way, deploy both rather than silently skip: a
          # needless deploy costs a build, a missed one ships nothing while
          # reporting success.
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable diff range -- deploying both services"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "ai=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "changed files:"
          echo "$files"
          engine=false
          ai=false
          echo "$files" | grep -q '^services/automation-engine/' && engine=true
          echo "$files" | grep -q '^services/ai-service/' && ai=true
          echo "engine=$engine ai=$ai"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "ai=$ai" >> "$GITHUB_OUTPUT"

      - name: Deploy automation-engine
        if: steps.changed.outputs.engine == 'true'
        env:
          HOOK: ${{ secrets.RENDER_ENGINE_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::warning title=No deploy hook::RENDER_ENGINE_DEPLOY_HOOK is not set, so automation-engine was not deployed. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST "$HOOK")
          echo "HTTP $code"
          cat body.json || true
          echo
          case "$code" in 200|201) ;; *) exit 1 ;; esac

      - name: Deploy ai-service
        if: steps.changed.outputs.ai == 'true'
        env:
          HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::warning title=No deploy hook::RENDER_AI_DEPLOY_HOOK is not set, so ai-service was not deployed. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST "$HOOK")
          echo "HTTP $code"
          cat body.json || true
          echo
          case "$code" in 200|201) ;; *) exit 1 ;; esac

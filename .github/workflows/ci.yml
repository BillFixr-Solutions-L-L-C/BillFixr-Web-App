name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR rather than letting an
# outdated push race an in-flight deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Placeholder values only — this build is a compile-correctness
      # check, not a real deploy artifact. The actual deploy build (below)
      # pulls the project's real env vars from Vercel itself.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          RESEND_API_KEY: placeholder-resend-key
          CRON_SECRET: placeholder-cron-secret

      # Runs after build, not before — `next build` generates route/layout
      # prop types under .next/types that tsc needs to resolve (e.g.
      # LayoutProps); running typecheck first fails on a fresh checkout
      # with no prior .next/ directory. Still worth its own step since it
      # also covers files outside Next's own build (e.g. *.test.ts).
      - run: npm run typecheck

  # The two Python services under services/ were not covered by CI at all
  # until 2026-11-05: `npm test` never reaches them, so 140 tests only ever
  # ran on someone's laptop. Both services are deployed to Render and the
  # web app now calls them in production, so a regression here is a
  # production regression.
  #
  # Deliberately NOT a dependency of the deploy jobs below. Those ship the
  # Next.js app to Vercel; the Python services deploy separately to Render.
  # Blocking a web hotfix on an unrelated engine test failure would be a
  # coupling that does not exist in the deploy path. Make these required
  # status checks in branch protection instead — that is what stops a red
  # suite being merged, without tying together two things that ship apart.
  python:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      # Both services are reported even when the first one fails, so a
      # failure in one does not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - service: ai-service
            install: pip install -e ".[dev]"
            lint: ruff check .
            deps: services/ai-service/pyproject.toml
          - service: automation-engine
            install: pip install -r requirements-dev.txt
            lint: ""
            deps: services/automation-engine/requirements*.txt
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # 3.11 is this project's floor (ai-service requires-python >=3.11)
      # and matches the Dockerfiles the Render services are built from.
      # cache-dependency-path is explicit because this step runs from the
      # repo root (`defaults.run.working-directory` applies to `run`, not
      # to actions), so pip's default lookup would not find the service's
      # own dependency file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.deps }}

      - run: ${{ matrix.install }}

      # Only ai-service configures ruff (pyproject.toml [tool.ruff]).
      - if: matrix.lint != ''
        run: ${{ matrix.lint }}

      - run: pytest -q

  # Deploys intentionally do NOT use `vercel pull` + `vercel build` +
  # `vercel deploy --prebuilt` (the pattern Vercel's own docs lead with).
  # That pattern builds locally on the runner, and this project has env
  # vars marked "Sensitive" in Vercel (NEXT_PUBLIC_SUPABASE_URL and
  # others) — Vercel deliberately refuses to hand sensitive values to a
  # local/CLI build, so `vercel pull` writes the literal string
  # "[SENSITIVE]" in their place. That shipped a broken production build
  # once already (2026-08-29) — the site 500'd because
  # NEXT_PUBLIC_SUPABASE_URL wasn't a real URL. `vercel deploy` without
  # `--prebuilt` instead uploads the source and lets Vercel's own build
  # infrastructure run `next build`, which is a context sensitive vars do
  # resolve in. Slower (no local build cache reuse) but correct, and
  # secrets never touch the GitHub-hosted runner either way.
  deploy-preview:
    name: Deploy preview
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            });

  deploy-production:
    name: Deploy production
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vercel deploy --prod` marks the deployment as the production
      # target, but does not reliably move the custom-domain aliases onto
      # it — confirmed 2026-08-29: two prior "successful" CI deploys (and
      # a fresh manual one) all left www.billfixr.com/billfixr.com
      # pointing at an old deployment, because a one-off manual
      # `vercel rollback` during an earlier incident left production
      # pinned. Explicitly re-aliasing every deploy makes this correct
      # regardless of any pinned state, instead of trusting the implicit
      # behavior.
      - name: Point the production domains at this deployment
        run: |
          vercel alias set ${{ steps.deploy.outputs.url }} www.billfixr.com --token=${{ secrets.VERCEL_TOKEN }}
          vercel alias set ${{ steps.deploy.outputs.url }} billfixr.com --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

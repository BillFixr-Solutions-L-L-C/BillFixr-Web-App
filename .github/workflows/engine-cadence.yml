# Keeps the negotiation engine's inbox and follow-up cadence moving more
# often than once a day.
#
# Why this exists: the Vercel account is on Hobby, which rejects any cron
# expression that would run more than once a day -- a deploy with
# `0 */4 * * *` was refused outright. So vercel.json runs
# /api/cron/negotiation-status at 13:00 and nothing else until the next
# day. That means a hospital reply could sit unread for up to 24 hours,
# and a "72-hour follow-up" fired whenever the engine next happened to be
# awake rather than at 72 hours.
#
# The route is unchanged and still does the right things in the right
# order: it makes the engine read its mailbox FIRST, then sweeps the
# running negotiations. This workflow only calls it more often.
#
# The Vercel crons stay as they are on purpose. GitHub's scheduler is
# best-effort -- runs are delayed under load, and a scheduled workflow is
# disabled automatically after 60 days without repository activity -- so
# the daily Vercel run remains the backstop that does not depend on this.
name: Engine cadence

on:
  schedule:
    # Every 30 minutes. A provider reply is then visible to the customer
    # within half an hour instead of within a day.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      route:
        description: "Which cron route to call"
        required: false
        default: negotiation-status
        type: choice
        options:
          - negotiation-status
          - follow-ups

permissions:
  contents: read

concurrency:
  # One at a time. Two overlapping runs would both ask the engine to sync
  # the same mailbox, and the second would be deciding what to chase from
  # a half-applied view of the first.
  group: engine-cadence
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the cron routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: ${{ vars.CRON_BASE_URL || 'https://www.billfixr.com' }}
          # A manual run may aim at one route; a scheduled run does both.
          ONLY: ${{ github.event.inputs.route }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set on this repository."
            echo "Add it with the same value as the Vercel environment variable:"
            echo "  gh secret set CRON_SECRET"
            exit 1
          fi

          # BOTH routes, in this order.
          #
          # negotiation-status makes the engine read its mailbox and sweep
          # the running negotiations; follow-ups is what sends the 72-hour
          # chase to a provider who has not replied. They are separate
          # routes and neither runs the other.
          #
          # This used to call one route, defaulting to negotiation-status,
          # and a second workflow (engine-cron.yml) looped over both. That
          # second workflow was removed on 2026-11-18 as a duplicate --
          # correctly, two workflows would have doubled every call -- but
          # the one that stayed was the one that did NOT call follow-ups.
          # So the follow-up cadence quietly went back to whatever Vercel
          # runs daily, which is the problem both workflows existed to fix.
          routes="negotiation-status follow-ups"
          [ -n "${ONLY:-}" ] && routes="${ONLY}"

          failed=""
          for route in ${routes}; do
            # The engine runs on Render's free tier and spins down when
            # idle, so the first request of a run is usually waking it up.
            # That cold start is slow but not a failure, hence the generous
            # timeout and the retries.
            attempt=1
            max=3
            ok=""
            while [ "${attempt}" -le "${max}" ]; do
              echo "${route}: attempt ${attempt}/${max}"
              code=$(curl -sS -o response.json -w '%{http_code}' \
                --max-time 240 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${BASE}/api/cron/${route}") || code="000"

              if [ "${code}" = "200" ]; then
                echo "${route}: ok"
                # The body is a count summary -- no patient data, no secrets.
                cat response.json
                echo
                ok="yes"
                break
              fi

              if [ "${code}" = "401" ]; then
                echo "::error::401 from /api/cron/${route} -- CRON_SECRET here does not match the one deployed on Vercel."
                exit 1
              fi

              echo "::warning::${route}: HTTP ${code} on attempt ${attempt}"
              attempt=$((attempt + 1))
              [ "${attempt}" -le "${max}" ] && sleep 30
            done

            # One route failing must not skip the other: a mailbox the
            # engine could not read is no reason to leave a provider
            # unchased. Collect and fail at the end.
            if [ -z "${ok}" ]; then
              echo "::error::/api/cron/${route} did not return 200 after ${max} attempts."
              cat response.json || true
              echo
              failed="${failed} ${route}"
            fi
          done

          if [ -n "${failed}" ]; then
            echo "::error::failed:${failed}"
            exit 1
          fi
